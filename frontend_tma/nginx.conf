server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # MediaPipe usa SIMD e thread WASM: senza isolamento cross-origin il
    # runtime ricade sulla versione lenta a thread singolo. Serve
    # `credentialless`: con `require-corp` il browser bloccherebbe
    # telegram-web-app.js, che non manda l'header CORP.
    add_header Cross-Origin-Opener-Policy same-origin always;
    add_header Cross-Origin-Embedder-Policy credentialless always;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # I .task e i .wasm sono immutabili: si possono tenere in cache a lungo.
    location ~* \.(task|wasm)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Cross-Origin-Resource-Policy same-origin always;
    }

    location ~* \.(js|css|woff2)$ {
        add_header Cache-Control "public, max-age=2592000";
    }
}
