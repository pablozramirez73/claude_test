# Punto d'ingresso unico della Mini App servita in locale.
#
# nginx serve i file statici e inoltra al backend le rotte dell'API, del
# canale WebSocket, dell'admin e dei file caricati. Il vantaggio non e' solo
# di comodita': Mini App e API finiscono sulla stessa origine, quindi non
# c'e' preflight CORS da soddisfare e il WebSocket non attraversa origini.

# Il DNS interno di Docker: risolvendo a runtime, nginx parte anche se il
# container dell'API non e' ancora pronto, invece di fallire all'avvio.
resolver 127.0.0.11 valid=30s ipv6=off;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 4m;
    gzip on;
    gzip_types application/json application/javascript text/css image/svg+xml;

    # MediaPipe usa SIMD e thread WASM: senza isolamento cross-origin il
    # runtime ricade sulla versione lenta a thread singolo. Serve
    # `credentialless`: con `require-corp` il browser bloccherebbe
    # telegram-web-app.js, che non manda l'header CORP.
    add_header Cross-Origin-Opener-Policy same-origin always;
    add_header Cross-Origin-Embedder-Policy credentialless always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # ------------------------------------------------------------ backend

    set $backend "http://ergo-api:7000";

    location /api/ {
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 120s;
    }

    # Aggiornamenti di stato del report: connessione lunga, va tenuta aperta.
    location /ws/ {
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 3600s;
    }

    location ~ ^/(admin|healthz)/ {
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    # Statici dell'admin e report PDF, quando non stanno su R2.
    # La barra dopo `media` e' necessaria: senza, il prefisso catturerebbe
    # anche /mediapipe/, cioe' i modelli serviti dalla Mini App.
    location ~ ^/(static|media)/ {
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    # ----------------------------------------------------------- Mini App

    # Attenzione: un `add_header` dentro un location *sostituisce* quelli
    # del blocco server invece di aggiungersi, quindi le intestazioni di
    # sicurezza vanno ripetute dove se ne aggiungono altre.

    # I .task e i .wasm sono immutabili: si possono tenere in cache a lungo.
    location ~* \.(task|wasm)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Cross-Origin-Resource-Policy same-origin always;
        add_header X-Content-Type-Options nosniff always;
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options nosniff always;
    }

    location ~* ^/(favicon\.(ico|svg)|apple-touch-icon\.png)$ {
        add_header Cache-Control "public, max-age=604800";
        add_header X-Content-Type-Options nosniff always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
