server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Single-page app: any unknown path falls back to index.html so React
    # Router-style client-side routes (if added later) keep working.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # The MediaPipe wasm/model assets are fetched from a CDN at runtime (see
    # src/vision/*.ts), not served from here — no extra MIME types needed.
}
