# Variante da usare *dietro Cloudflare Tunnel*: nessun TLS, nessuna porta
# pubblica. cloudflared si collega qui in loopback e il TLS lo termina
# Cloudflare, quindi la 443 del server resta chiusa.
#
# Serve solo se i report restano su disco: con R2 il tunnel puo' puntare
# direttamente a daphne (127.0.0.1:7000) e nginx non serve affatto, perche'
# gli statici dell'admin li serve gia' whitenoise.
#
#   sudo cp nginx-api-tunnel.conf /etc/nginx/sites-available/ergocheck-api
#   sudo ln -s /etc/nginx/sites-available/ergocheck-api /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx

upstream ergocheck_api {
    server 127.0.0.1:7000;
    keepalive 32;
}

server {
    # Solo loopback: nessuna interfaccia esterna in ascolto.
    listen 127.0.0.1:8080;
    server_name api.syntaxnode.work;

    client_max_body_size 4m;
    gzip on;
    gzip_types application/json text/css application/javascript;

    location /media/ {
        alias /srv/ergocheck/media/;
        add_header Cache-Control "private, max-age=3600";
    }

    location /static/ {
        alias /srv/ergocheck/staticfiles/;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    location /ws/ {
        proxy_pass http://ergocheck_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        # cloudflared passa gia' CF-Connecting-IP e X-Forwarded-Proto: qui si
        # propagano soltanto, senza riscriverli.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 3600s;
    }

    location / {
        proxy_pass http://ergocheck_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header Connection "";
        proxy_read_timeout 120s;
    }
}
