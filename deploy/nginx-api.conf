# Reverse proxy per l'API ErgoCheck su api.syntaxnode.work
#
# Il traffico arriva da Cloudflare (record proxied). TLS fra Cloudflare e
# questo server con un Origin Certificate di Cloudflare, cosi' la modalita'
# SSL/TLS puo' stare su "Full (strict)".
#
# Installazione:
#   sudo cp nginx-api.conf /etc/nginx/sites-available/ergocheck-api
#   sudo ln -s /etc/nginx/sites-available/ergocheck-api /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx

upstream ergocheck_api {
    server 127.0.0.1:8000;
    keepalive 32;
}

# Solo Cloudflare deve poter raggiungere l'origine: il firewall va chiuso a
# tutto il resto (ufw allow from <range Cloudflare> to any port 443).
server {
    listen 80;
    listen [::]:80;
    server_name api.syntaxnode.work;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name api.syntaxnode.work;

    ssl_certificate     /etc/ssl/cloudflare/syntaxnode.work.pem;
    ssl_certificate_key /etc/ssl/cloudflare/syntaxnode.work.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # L'IP reale del client arriva nell'header di Cloudflare: senza questa
    # mappatura il rate limiting di DRF vedrebbe un solo indirizzo.
    real_ip_header CF-Connecting-IP;
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;

    client_max_body_size 4m;
    gzip on;
    gzip_types application/json text/css application/javascript;

    # I report PDF: in produzione con USE_S3=True vengono serviti da S3 con
    # link firmati e questo blocco non viene usato.
    location /media/ {
        alias /srv/ergocheck/media/;
        expires 1h;
        add_header Cache-Control "private, max-age=3600";
    }

    location /static/ {
        alias /srv/ergocheck/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    # Canale WebSocket degli aggiornamenti di stato del report.
    location /ws/ {
        proxy_pass http://ergocheck_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 3600s;
    }

    location / {
        proxy_pass http://ergocheck_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_read_timeout 120s;
    }
}
