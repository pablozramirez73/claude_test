# Runs the full MISURA stack together: PostgreSQL + Django backend +
# frontend Mini App. This repo hosts several independent apps (see
# apps/*), so this file is named explicitly rather than claiming the
# generic "docker-compose.yml" at the repo root — each app also has its
# own self-contained compose file for running it on its own:
#   apps/misura-backend/docker-compose.yml   (db + backend only)
#   apps/misura-miniapp/docker-compose.yml   (frontend only)
#
# Usage (from the repo root):
#   docker compose -f docker-compose.misura.yml up
#
# Then open http://localhost:8091 (or whatever MISURA_WEB_PORT you set).
# Ports are overridable the same way as each app's own compose file — copy
# .env.example to .env here, or pass vars inline. Note: the frontend does
# not call the backend API yet (see docs/PRD-misura.md §11) — this just
# starts all three services together for convenience.
#
# The values after `:-` below (e.g. `misura`, `insecure-dev-key-change-me`)
# are intentionally-fake dev-only placeholders, not real credentials — see
# .env.example.
x-postgres-env: &postgres-env
  POSTGRES_DB: ${POSTGRES_DB:-misura}
  POSTGRES_USER: ${POSTGRES_USER:-misura}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-misura}

services:
  db:
    image: postgres:16-alpine
    environment:
      <<: *postgres-env
    ports:
      - "${POSTGRES_PORT:-5442}:5432"
    volumes:
      - misura_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-misura}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./apps/misura-backend
    environment:
      <<: *postgres-env
      POSTGRES_HOST: db
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-insecure-dev-key-change-me}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-false}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1}
      DJANGO_CORS_ALLOWED_ORIGINS: ${DJANGO_CORS_ALLOWED_ORIGINS:-http://localhost:8091,http://localhost:5183}
      PROFILE_HASH_SALT: ${PROFILE_HASH_SALT:-misura-dev-salt-change-me}
    ports:
      - "${BACKEND_PORT:-8099}:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./apps/misura-miniapp
      target: production
    ports:
      - "${MISURA_WEB_PORT:-8091}:80"
    depends_on:
      - backend

volumes:
  misura_postgres_data:
